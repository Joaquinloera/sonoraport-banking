name: Netlify manual-upload ZIP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify website
        run: |
          node scripts/verify-website.mjs
          node website/integrations/verify-integrations.mjs
          node website/integrations/verify-global-evidence.mjs
          node --test src/gateway.test.mjs
      - name: Package Netlify publish directory
        run: |
          cd website
          zip -qr ../sonoraport-netlify-upload.zip .
          cd ..
          unzip -t sonoraport-netlify-upload.zip | tail -1
          unzip -Z1 sonoraport-netlify-upload.zip | grep -Fx 'index.html'
      - name: Upload Netlify ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonoraport-netlify-upload
          path: sonoraport-netlify-upload.zip
          retention-days: 30
