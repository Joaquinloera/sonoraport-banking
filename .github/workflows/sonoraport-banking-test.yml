name: SonoraPort Banking Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  banking-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate package.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json valid')"

      - name: Check server syntax
        run: |
          node --check server.js

      - name: Enforce production rail registry alignment
        run: |
          node <<'NODE'
          const fs = require("fs");

          const declared = JSON.parse(
            fs.readFileSync(
              "production-payment-rails.json",
              "utf8"
            )
          );

          const runtime =
            require("./production-rail-runtime");

          const declaredRails =
            Object.keys(
              declared.rails || {}
            ).sort();

          const runtimeRails =
            Object.keys(
              runtime.RAIL_CONFIGURATION || {}
            ).sort();

          console.log(
            "Declared rails:",
            declaredRails.join(", ")
          );

          console.log(
            "Runtime rails:",
            runtimeRails.join(", ")
          );

          if (
            JSON.stringify(declaredRails) !==
            JSON.stringify(runtimeRails)
          ) {
            console.error(
              "PRODUCTION RAIL DRIFT DETECTED"
            );

            console.error(
              "Declared:",
              declaredRails
            );

            console.error(
              "Runtime:",
              runtimeRails
            );

            process.exit(1);
          }

          for (const rail of declaredRails) {
            const declaredRail =
              declared.rails[rail];

            const runtimeRail =
              runtime.RAIL_CONFIGURATION[rail];

            if (
              Boolean(declaredRail.enabled) !==
              Boolean(runtimeRail.enabled)
            ) {
              throw new Error(
                `Enabled-state drift: ${rail}`
              );
            }

            if (
              declaredRail.mode !==
              runtimeRail.mode
            ) {
              throw new Error(
                `Mode drift: ${rail}`
              );
            }
          }

          console.log(
            "Production rail registry alignment PASS"
          );
          NODE

      - name: Enforce unverified rail safety boundary
        run: |
          node <<'NODE'
          const runtime =
            require("./production-rail-runtime");

          const statuses =
            runtime.allStatuses();

          if (statuses.length !== 6) {
            throw new Error(
              `Expected 6 production rails, found ${statuses.length}`
            );
          }

          for (const rail of statuses) {
            if (
              rail.authenticated === true
            ) {
              throw new Error(
                `${rail.provider} unexpectedly claims authentication`
              );
            }

            if (
              rail.providerVerified === true
            ) {
              throw new Error(
                `${rail.provider} unexpectedly claims provider verification`
              );
            }

            if (
              rail.settlementVerified === true
            ) {
              throw new Error(
                `${rail.provider} unexpectedly claims settlement verification`
              );
            }

            if (
              rail.credentialsExposed === true
            ) {
              throw new Error(
                `${rail.provider} exposes credentials`
              );
            }
          }

          console.log(
            "Unverified rail safety boundary PASS"
          );
          NODE

      - name: Generate temporary test authentication
        run: |
          echo "MATCHA_MANITA_BANKING_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "BANKING_REAL_SETTLEMENT_AUTHORIZED=false" >> "$GITHUB_ENV"

      - name: Start SonoraPort Banking
        run: |
          node server.js > banking.log 2>&1 &
          echo $! > banking.pid
          sleep 2

      - name: Test banking health
        run: |
          curl --fail --silent \
            http://127.0.0.1:3100/api/health \
            | tee health.json

          grep -q '"status": "healthy"' health.json

      - name: Test banking capabilities
        run: |
          curl --fail --silent \
            http://127.0.0.1:3100/api/capabilities \
            | tee capabilities.json

          grep -q '"paymentIntents": true' capabilities.json
          grep -q '"realSettlementAuthorized": false' capabilities.json

      - name: Test World Sandbox boundary
        run: |
          curl --fail --silent \
            http://127.0.0.1:3100/api/world-sandbox/status \
            | tee world-sandbox.json

          grep -q '"credentialRead": false' world-sandbox.json
          grep -q '"unrestrictedTransfers": false' world-sandbox.json

      - name: Reject unauthenticated MATCHA MANITA request
        run: |
          STATUS=$(curl --silent \
            --output unauthorized.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: unauthorized-test-001" \
            -d '{"amount":1250,"currency":"USD","orderId":"TEST-UNAUTHORIZED"}' \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents)

          test "$STATUS" = "401"

      - name: Create sandbox payment intent
        run: |
          curl --fail --silent \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: matcha-test-intent-001" \
            -d '{"amount":1250,"currency":"USD","orderId":"MATCHA-TEST-001","description":"MATCHA MANITA sandbox integration test"}' \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents \
            | tee payment-intent.json

          grep -q '"status": "requires_authorization"' payment-intent.json
          grep -q '"mode": "sandbox"' payment-intent.json
          grep -q '"settlementExecuted": false' payment-intent.json

          node -e "const x=require('./payment-intent.json'); if(!x.paymentIntent?.id) process.exit(1); require('fs').writeFileSync('payment-intent-id.txt',x.paymentIntent.id)"

      - name: Test idempotency replay
        run: |
          curl --fail --silent \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: matcha-test-intent-001" \
            -d '{"amount":1250,"currency":"USD","orderId":"MATCHA-TEST-001","description":"MATCHA MANITA sandbox integration test"}' \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents \
            | tee replay.json

          grep -q '"idempotentReplay": true' replay.json

      - name: Verify payment intent status
        run: |
          INTENT_ID=$(cat payment-intent-id.txt)

          curl --fail --silent \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            "http://127.0.0.1:3100/api/matcha-manita/payment-intents/$INTENT_ID" \
            | tee payment-status.json

          grep -q '"status": "requires_authorization"' payment-status.json

      - name: Verify audit receipt
        run: |
          INTENT_ID=$(cat payment-intent-id.txt)

          curl --fail --silent \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            "http://127.0.0.1:3100/api/matcha-manita/payment-intents/$INTENT_ID/receipt" \
            | tee receipt.json

          grep -q '"protocol": "SONORAPORT-AUDIT-1"' receipt.json
          grep -q '"paymentStatus": "requires_authorization"' receipt.json

      - name: Cancel sandbox payment intent
        run: |
          INTENT_ID=$(cat payment-intent-id.txt)

          curl --fail --silent \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            "http://127.0.0.1:3100/api/matcha-manita/payment-intents/$INTENT_ID/cancel" \
            | tee cancelled.json

          grep -q '"status": "cancelled"' cancelled.json

      - name: Verify cancelled status
        run: |
          INTENT_ID=$(cat payment-intent-id.txt)

          curl --fail --silent \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            "http://127.0.0.1:3100/api/matcha-manita/payment-intents/$INTENT_ID" \
            | tee cancelled-status.json

          grep -q '"status": "cancelled"' cancelled-status.json

      - name: Reject conflicting idempotency replay
        run: |
          STATUS=$(curl --silent \
            --output conflict.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: matcha-test-intent-001" \
            -d '{"amount":1300,"currency":"USD","orderId":"MATCHA-TEST-CHANGED"}' \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents)

          test "$STATUS" = "409"
          grep -q 'different request' conflict.json

      - name: Reject malformed JSON
        run: |
          STATUS=$(curl --silent \
            --output malformed.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: malformed-json-001" \
            --data-binary '{"amount":1250' \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents)

          test "$STATUS" = "400"
          grep -q 'Invalid JSON request body' malformed.json

      - name: Reject oversized JSON body
        run: |
          node -e "require('fs').writeFileSync('oversized.json', JSON.stringify({description:'x'.repeat(65537)}))"

          STATUS=$(curl --silent \
            --output oversized-response.json \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Idempotency-Key: oversized-json-001" \
            --data-binary @oversized.json \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents)

          test "$STATUS" = "413"
          grep -q 'Request body too large' oversized-response.json

      - name: Reject nonexistent payment intent
        run: |
          STATUS=$(curl --silent \
            --output missing-intent.json \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            http://127.0.0.1:3100/api/matcha-manita/payment-intents/pi_does-not-exist)

          test "$STATUS" = "404"
          grep -q 'Payment intent not found' missing-intent.json

      - name: Verify cancellation replay is stable
        run: |
          INTENT_ID=$(cat payment-intent-id.txt)

          curl --fail --silent \
            -X POST \
            -H "Authorization: Bearer $MATCHA_MANITA_BANKING_TOKEN" \
            "http://127.0.0.1:3100/api/matcha-manita/payment-intents/$INTENT_ID/cancel" \
            | tee cancel-replay.json

          grep -q '"status": "cancelled"' cancel-replay.json

      - name: Stop SonoraPort Banking
        if: always()
        run: |
          if [ -f banking.pid ]; then
            kill "$(cat banking.pid)" 2>/dev/null || true
          fi

          echo "=== Banking runtime log ==="
          cat banking.log 2>/dev/null || true
