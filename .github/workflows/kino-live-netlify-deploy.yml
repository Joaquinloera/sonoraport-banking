name: KINO Live SonoraPort Netlify Website Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kino-sonoraport-production
  cancel-in-progress: false
jobs:
  verify-and-publish-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NETLIFY_SITE_ID: 588bcdea-734c-4b3c-a225-1ef92c20ef53
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source catalog and safety of added production pages
        run: |
          node website/global-banking/build-public-snapshot.mjs --check
          node --test deployment/deploy-live-banking.test.mjs deployment/build-banking-preview.test.mjs website/global-banking/*.test.mjs website/home/*.test.mjs website/master-map/*.test.mjs
      - name: Ensure deployment permission exists for live Netlify website
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo 'LIVE DEPLOYMENT BLOCKED: configure NETLIFY_AUTH_TOKEN in GitHub Actions secrets'
            exit 1
          fi
      - name: Deploy into EXISTING production domain without replacing homepage
        run: node deployment/deploy-live-banking.mjs
