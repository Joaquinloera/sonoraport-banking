<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonoraPort | BUILD18 API Evidence</title><style>body{margin:0;background:#081321;color:#f5f5ef;font:16px/1.6 system-ui}main{max-width:1100px;margin:auto;padding:45px 20px}h1{font:normal clamp(32px,5vw,60px) Georgia,serif;color:#e2bb78}a{color:#e2bb78}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}.card{background:#10253a;border:1px solid #635438;border-radius:12px;padding:20px}.tag{font-size:12px;letter-spacing:.12em;color:#b8c6d5;text-transform:uppercase}</style></head><body><main><p><a href="../index.html">← SonoraPort</a> · <a href="research-operations.html">Research operations</a></p><p class="tag">BUILD 18 · Official API documentation</p><h1>Global technology integration evidence</h1><p>Source-backed developer documentation. No live banking or autonomous AI worker connection is implied.</p><div class="grid" id="results" aria-live="polite"></div><p><a href="build18-evidence.json">View structured JSON →</a></p></main><script>fetch('build18-evidence.json').then(r=>{if(!r.ok)throw Error('Evidence unavailable');return r.json()}).then(d=>{for(const p of d.providers){const a=document.createElement('article');a.className='card';const k=document.createElement('p');k.className='tag';k.textContent=p.category+' · '+p.region;const h=document.createElement('h2');h.textContent=p.name;const detail=document.createElement('p');detail.textContent=p.interface;const link=document.createElement('a');link.href=p.official;link.target='_blank';link.rel='noopener noreferrer';link.textContent='Official documentation →';a.append(k,h,detail,link);document.querySelector('#results').append(a)}}).catch(e=>document.querySelector('#results').textContent=e.message)</script></body></html>
