<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonoraPort Global Banking Evidence</title><style>:root{color-scheme:dark}body{margin:0;background:#080d15;color:#f3eee5;font:16px/1.6 system-ui}header,main{max-width:1120px;margin:auto;padding:24px}a{color:#d7b478}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{padding:24px;background:#111d2c;border:1px solid #5b4c37;border-radius:12px}h1,h2{font-family:Georgia,serif}.note{color:#c8c2b7}input{padding:12px;width:min(95%,400px);background:#17293a;color:white;border:1px solid #ad946b;border-radius:8px}</style></head><body><header><a href="../home/">← SonoraPort homepage</a> · <a href="../swarm-skim/command-center.html">SWARM command center</a><h1>Global Banking Integration Evidence</h1><p class="note">Official documentation research feeding the SonoraPort platform. No live bank connections are claimed.</p></header><main><label for="search">Filter banks, corridors, and capabilities</label><p><input id="search" type="search" placeholder="Brazil, Pix, SPEI, OAuth2…"></p><p id="summary" role="status">Loading provider evidence…</p><section id="results" class="grid"></section></main><script type="module">const results=document.getElementById('results'),summary=document.getElementById('summary'),search=document.getElementById('search');let rows=[];function render(){results.replaceChildren();const q=search.value.toLowerCase();const matching=rows.filter(x=>[x.name,x.region,x.type,...x.facts].join(' ').toLowerCase().includes(q));for(const p of matching){const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.name;c.append(h);const sub=document.createElement('p');sub.textContent=p.region+' · '+p.status+' · '+p.access;c.append(sub);const ul=document.createElement('ul');for(const fact of p.facts){const li=document.createElement('li');li.textContent=fact;ul.append(li)}c.append(ul);const a=document.createElement('a');const u=new URL(p.url);if(u.protocol==='https:'){a.href=u.href;a.rel='noopener noreferrer';a.target='_blank';a.textContent='Official source';c.append(a)}results.append(c)}summary.textContent=matching.length+' source-backed records · 0 verified live provider connections'}search.addEventListener('input',render);try{const response=await fetch('./global-banking-evidence.json');if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.records))throw Error('Invalid registry');rows=data.records;render()}catch(e){summary.textContent='Unable to load evidence: '+e.message}</script></body></html>
