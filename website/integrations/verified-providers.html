<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonoraPort | Verified Provider Research</title><style>:root{color-scheme:dark;font:16px system-ui}body{margin:0;background:#0b1422;color:#f4f0e6}header,main{max-width:1100px;margin:auto;padding:24px}a{color:#e7c77e}h1{font-size:clamp(1.8rem,4vw,3rem)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{border:1px solid #45576c;border-radius:14px;background:#15263a;padding:20px}.muted{color:#bbc9d9}.status{color:#ffd2a0}input{padding:12px;background:#24354a;color:white;border:1px solid #91a3b6;border-radius:8px;width:min(100%,400px)}li{margin:6px 0}</style></head><body><header><nav><a href="../home/">SonoraPort home</a> · <a href="../swarm-skim/command-center.html">SWARM command center</a> · <a href="./index.html">Existing integration workbench</a></nav><h1>Verified Provider Research</h1><p class="muted">Evidence-backed technical documentation; not a live connection.</p></header><main><label for="filter">Filter providers</label><p><input id="filter" type="search" placeholder="Search provider or capability"></p><p id="status" role="status">Loading…</p><section id="cards" class="grid"></section></main><script type="module">const cards=document.getElementById('cards'),status=document.getElementById('status'),filter=document.getElementById('filter');let records=[];function draw(){cards.replaceChildren();const q=filter.value.toLowerCase();const found=records.filter(p=>(p.name+' '+p.category+' '+p.capabilities.join(' ')).toLowerCase().includes(q));for(const p of found){const c=document.createElement('article');c.className='card';const h=document.createElement('h2');h.textContent=p.name;c.append(h);const s=document.createElement('p');s.className='status';s.textContent='Connection: '+p.connection;c.append(s);const cat=document.createElement('p');cat.textContent='Category: '+p.category+' · Access: '+p.access;c.append(cat);const ul=document.createElement('ul');for(const item of p.capabilities){const li=document.createElement('li');li.textContent=item;ul.append(li)}c.append(ul);const a=document.createElement('a');a.textContent='Official documentation';const u=new URL(p.documentation);if(u.protocol==='https:'){a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';c.append(a)}cards.append(c)}status.textContent=found.length+' documented providers; 0 verified live connections'}filter.addEventListener('input',draw);try{const r=await fetch('./providers.json');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();records=d.providers;draw()}catch(e){status.textContent='Registry unavailable: '+e.message}</script></body></html>
