<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SonoraPort | Global Technology Administration Hub</title>
<style>body{margin:0;background:#080d15;color:#f3eee5;font:16px/1.6 system-ui}header,main{max-width:1150px;margin:auto;padding:24px}a{color:#d6b277}h1,h2{font-family:Georgia,serif}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{border:1px solid #594b35;background:#132234;border-radius:12px;padding:20px}input,select{padding:12px;background:#1a2d43;color:white;border:1px solid #b7a07d;border-radius:8px}nav{display:flex;gap:16px;flex-wrap:wrap}</style>
</head><body><header><nav><a href="../home/">Home</a><a href="./global-banking-evidence.html">Banking</a><a href="./americas-api-skim.html">API SKIM</a><a href="./global-technology-evidence.html">Technology Evidence</a><a href="../swarm-skim/command-center.html">SWARM</a></nav><h1>Global Technology Administration Hub</h1><p>AI, public defense software, biotechnology, banking, blockchain and digital infrastructure. Research-only records; no live connections implied.</p></header>
<main><label for="search">Search provider research</label><p><input id="search" type="search" placeholder="Provider or capability"> <select id="category"><option value="">All sectors</option></select></p><p id="status" role="status">Loading…</p><section id="cards" class="grid"></section></main>
<script type="module">
const search=document.querySelector("#search"),category=document.querySelector("#category"),cards=document.querySelector("#cards"),status=document.querySelector("#status");let providers=[];
function render(){cards.replaceChildren();const q=search.value.toLowerCase();const matches=providers.filter(p=>(!category.value||p.category===category.value)&&[p.name,p.category,p.capability,p.region].join(" ").toLowerCase().includes(q));for(const p of matches){const box=document.createElement("article");box.className="card";const h=document.createElement("h2");h.textContent=p.name;box.append(h);for(const value of [p.category+" · "+p.region,p.capability,"Access: "+p.access,"Connection: "+p.connection]){const t=document.createElement("p");t.textContent=value;box.append(t)}try{const url=new URL(p.documentation);if(url.protocol==="https:"){const link=document.createElement("a");link.href=url.href;link.textContent="Official documentation";link.rel="noopener noreferrer";link.target="_blank";box.append(link)}}catch{}cards.append(box)}status.textContent=matches.length+" of "+providers.length+" records · 0 verified live connections"}
search.addEventListener("input",render);category.addEventListener("change",render);
try{const response=await fetch("./global-technology-evidence.json");if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();providers=data.providers;for(const c of [...new Set(providers.map(p=>p.category))].sort()){const option=document.createElement("option");option.value=c;option.textContent=c;category.append(option)}render()}catch(error){status.textContent="Could not load registry: "+error.message}
</script></body></html>
