<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TMM SonoraPort | Americas API Engineering</title><style>:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{background:#080e18;color:#f3ead8;margin:0}header,main{max-width:1250px;margin:auto;padding:24px}header{border-bottom:1px solid #655333}a{color:#e7c783}h1{font:clamp(2rem,4vw,3.4rem) Georgia,serif}p{color:#bec8d4}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}input,select{background:#17283b;color:white;border:1px solid #8d806a;padding:12px;border-radius:8px;font:inherit;flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}.card{background:#122136;border:1px solid #5a5144;border-radius:12px;padding:18px}.card h2{color:#e7c783;font:1.4rem Georgia,serif}.card p{overflow-wrap:anywhere}nav{display:flex;gap:18px;flex-wrap:wrap}small{color:#abb8c7}</style></head><body><header><nav><a href="../home/">Home</a><a href="./global-banking-evidence.html">Banking evidence</a><a href="./global-technology-evidence.html">AI and technology</a><a href="../swarm-skim/command-center.html">SWARM command center</a></nav><h1>Americas API Engineering Workbench</h1><p>United States · Mexico · South America · Caribbean · BRICS connections · blockchain</p><small>Public documentation research only. No API keys or financial accounts are accessed.</small></header><main><div class="filters"><input id="query" type="search" aria-label="Search providers" placeholder="Search bank, region, API, JSON, authentication"><select id="region" aria-label="Filter by region"><option value="">All regions</option></select></div><p id="status" role="status">Loading technical records…</p><div id="results" class="grid"></div></main><script>"use strict";const $=id=>document.getElementById(id);let records=[];const norm=s=>String(s??"").toLowerCase();function render(){const q=norm($("query").value),region=$("region").value;const items=records.filter(x=>(!region||x.region===region)&&(!q||Object.values(x).some(v=>norm(v).includes(q))));$("status").textContent=items.length+" of "+records.length+" researched integrations · 0 live connections verified";$("results").replaceChildren();for(const x of items){const c=document.createElement("article");c.className="card";const h=document.createElement("h2");h.textContent=x.name;c.append(h);for(const [label,key] of [["Region","region"],["Category","kind"],["Authentication","authentication"],["API key","apiKey"],["JSON / API","json"],["Sandbox","sandbox"],["Verification","status"]]){const p=document.createElement("p");const b=document.createElement("strong");b.textContent=label+": ";p.append(b,document.createTextNode(String(x[key]??"not documented")));c.append(p)}try{const u=new URL(x.official);if(u.protocol==="https:"){const a=document.createElement("a");a.href=u.href;a.rel="noopener noreferrer";a.target="_blank";a.textContent="Official developer documentation ↗";c.append(a)}}catch{}$("results").append(c)}}fetch("./americas-api-skim.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(d=>{records=d.providers||[];for(const v of [...new Set(records.map(x=>x.region))].sort()){const o=document.createElement("option");o.value=v;o.textContent=v;$("region").append(o)}render()}).catch(e=>$("status").textContent="Research data unavailable: "+e.message);$("query").addEventListener("input",render);$("region").addEventListener("change",render);</script></body></html>
