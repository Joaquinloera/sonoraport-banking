<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SonoraPort | Bank Evidence Workbench</title><style>body{background:#091526;color:#f3e9d5;font:16px system-ui;margin:0}header,main{max-width:1200px;margin:auto;padding:24px}a{color:#eac77b}input{background:#15283f;color:white;border:1px solid #8c7854;padding:12px;width:min(100%,500px)}table{border-collapse:collapse;width:100%}td,th{padding:12px;text-align:left;border-bottom:1px solid #40516a}th{color:#eac77b}.scroll{overflow:auto}.note{color:#b6c6d7}</style></head><body><header><a href="../home/">Original homepage</a> · <a href="../integrations/code-matrix.html">Technology matrix</a> · <a href="../global-banking/">Global banking</a><h1>Worldwide bank evidence workbench</h1><p class="note">Bank-by-bank public source research. Not a worldwide completed bank directory; no live bank connections or transfers.</p></header><main><label for="filter">Search bank, country or source status</label><p><input id="filter" type="search" placeholder="ICBC, Mexico, API..."></p><p id="summary" role="status">Loading research...</p><div class="scroll"><table><thead><tr><th>Bank</th><th>Country</th><th>Source classification</th><th>API status</th><th>Official research source</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const el=document.getElementById("rows"),input=document.getElementById("filter"),summary=document.getElementById("summary");let all=[];function render(){el.replaceChildren();const q=input.value.toLowerCase(),items=all.filter(r=>[r.name,r.country,r.evidenceType,r.apiAccess].join(" ").toLowerCase().includes(q));for(const r of items){const tr=document.createElement("tr");for(const value of [r.name,r.country,r.evidenceType,r.apiAccess]){const td=document.createElement("td");td.textContent=value;tr.append(td)}const td=document.createElement("td"),a=document.createElement("a");a.href=r.sourceUrl;a.textContent="Source";a.rel="noopener noreferrer";a.target="_blank";td.append(a);tr.append(td);el.append(tr)}summary.textContent=items.length+" of "+all.length+" bank research seeds · 0 verified production connections"}input.addEventListener("input",render);fetch("../../research/worldwide-banking/bank-evidence-seed.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(x=>{if(!Array.isArray(x.records))throw Error("Invalid schema");all=x.records;render()}).catch(e=>{summary.textContent="Research file unavailable: "+e.message})</script></body></html>
