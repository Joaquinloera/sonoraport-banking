<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldwide Bank Directory | SonoraPort</title><link rel="stylesheet" href="./portal.css"><style>main{max-width:1160px;margin:auto;padding:32px 18px}input,select{padding:14px;background:#131f30;color:#fff;border:1px solid #987d4b;border-radius:8px;width:100%}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:22px}.card{border:1px solid #76613d;border-radius:12px;padding:18px;background:#101c2b}.card a{color:#eac489}button{padding:12px;margin:8px;color:#eac489;background:#15263a;border:1px solid #987d4b;border-radius:8px}</style></head><body><main><a href="./">← Global Banking</a><h1>Worldwide bank directory</h1><p>Regulator-extracted bank names and official developer references. Evidence is not a verified account, provider agreement, or live connection.</p><p id="summary" role="status">Loading bank records…</p><div class="filters"><label>Search banks<input id="q" type="search" placeholder="Bank, country or type"></label><label>Country<select id="country"><option value="">All countries</option></select></label></div><div id="results" class="cards"></div><nav><button id="prev" type="button">Previous</button><span id="page"></span><button id="next" type="button">Next</button></nav></main><script type="module">const $=s=>document.querySelector(s);const data=await fetch('./bank-directory-data.json').then(r=>{if(!r.ok)throw Error('Bank evidence unavailable');return r.json()}).catch(e=>({error:e.message}));if(data.error||data.mode!=='PUBLIC_BANK_EVIDENCE_NOT_LIVE'||data.liveConnections!==0||!Array.isArray(data.records)||data.total!==data.records.length){$('#summary').textContent='Verified bank evidence unavailable';throw Error('Invalid bank data')}const countries=[...new Set(data.records.map(r=>r.country).filter(Boolean))].sort();for(const c of countries){const o=document.createElement('option');o.value=c;o.textContent=c;$('#country').append(o)}let offset=0;const size=24;function render(){const q=$('#q').value.toLowerCase().trim(),c=$('#country').value;const rows=data.records.filter(r=>(!c||r.country===c)&&(!q||[r.name,r.country,r.type,r.access].join(' ').toLowerCase().includes(q)));const host=$('#results');host.replaceChildren();for(const r of rows.slice(offset,offset+size)){const card=document.createElement('article');card.className='card';const h=document.createElement('h3');h.textContent=r.name;const p=document.createElement('p');p.textContent=r.country+' · '+r.type+' · '+(r.access==='UNVERIFIED'?'API access not verified':String(r.access||'Access status unknown'));card.append(h,p);try{const u=new URL(r.source);if(u.protocol==='https:'){const a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Official reference ↗';card.append(a)}}catch{}host.append(card)}$('#summary').textContent=rows.length+' matching bank evidence records · 0 verified live bank connections';$('#page').textContent=(rows.length?offset+1:0)+'–'+Math.min(offset+size,rows.length)+' of '+rows.length;$('#prev').disabled=offset===0;$('#next').disabled=offset+size>=rows.length}$('#q').addEventListener('input',()=>{offset=0;render()});$('#country').addEventListener('change',()=>{offset=0;render()});$('#prev').onclick=()=>{offset=Math.max(0,offset-size);render()};$('#next').onclick=()=>{offset+=size;render()};render();</script></body></html>
